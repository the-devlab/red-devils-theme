<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#1A1A1A" stroke="#FBE122" stroke-width="6"/>

  <g fill="#DA291C">
    <!-- Prong tips -->
    <polygon points="76,36 58,82 94,82"/>
    <polygon points="128,24 108,74 148,74"/>
    <polygon points="180,36 162,82 198,82"/>
    <!-- Middle prong -->
    <rect x="119" y="66" width="18" height="70"/>
    <!-- Shaft -->
    <rect x="119" y="128" width="18" height="96" rx="9"/>
  </g>

  <!-- Curved crossbar joining the outer prongs -->
  <path d="M76 78 V104 Q76 136 128 136 Q180 136 180 104 V78"
        fill="none" stroke="#DA291C" stroke-width="18" stroke-linecap="butt"/>

  <!-- Gold collar on the shaft -->
  <rect x="109" y="156" width="38" height="12" rx="4" fill="#FBE122"/>
</svg>
